<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiffIQ — Document Change Intelligence</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #c9d1d9; --text-dim: #8b949e; --primary: #238636;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: bold; }
    .btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .upload-area { display: flex; gap: 2rem; padding: 2rem; justify-content: center; }
    .drop-zone { flex: 1; max-width: 400px; border: 2px dashed var(--border); border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.2s; }
    .drop-zone:hover, .drop-zone.active { border-color: var(--primary); background: rgba(35, 134, 54, 0.05); }
    .drop-zone h3 { margin: 0 0 1rem 0; }
    .drop-zone p { color: var(--text-dim); font-size: 0.9rem; }
    .file-types { font-size: 0.8rem; color: var(--text-dim); margin-top: 1rem; }
    .actions { text-align: center; margin-bottom: 2rem; }
    .results { flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--border); overflow: hidden; }
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .tab { padding: 0.75rem 1.5rem; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-dim); }
    .tab.active { color: var(--text); border-bottom-color: var(--primary); }
    .tab-content { flex: 1; overflow: auto; padding: 1rem; display: none; }
    .tab-content.active { display: block; }
    .diff-line { font-family: monospace; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }
    .added { background: rgba(46, 160, 67, 0.2); color: #2ea043; }
    .removed { background: rgba(248, 81, 73, 0.2); color: #f85149; }
    .preview-frame { width: 100%; height: 100%; border: none; background: white; }
    .preview-text { white-space: pre-wrap; word-wrap: break-word; font-family: monospace; color: var(--text); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="logo">DiffIQ</div>
    <div>
      <button class="btn" id="btn-new">New Comparison</button>
      <button class="btn btn-primary" id="btn-compare">Compare</button>
    </div>
  </header>

  <main>
    <div id="upload-section">
      <div class="upload-area">
        <div class="drop-zone" id="zone-old">
          <h3>Old version</h3>
          <p>Drop your original document here or click to browse</p>
          <div class="file-types">TXT, MD, DOCX, PDF, XLSX, CSV, HTML</div>
          <input type="file" id="file-old" class="hidden" accept=".txt,.md,.docx,.pdf,.xlsx,.csv,.html">
        </div>
        <div class="drop-zone" id="zone-new">
          <h3>New version</h3>
          <p>Drop the updated document here or click to browse</p>
          <div class="file-types">TXT, MD, DOCX, PDF, XLSX, CSV, HTML</div>
          <input type="file" id="file-new" class="hidden" accept=".txt,.md,.docx,.pdf,.xlsx,.csv,.html">
        </div>
      </div>
    </div>

    <div id="results-section" class="results hidden">
      <div class="tabs">
        <div class="tab active" data-tab="comparison">Comparison</div>
        <div class="tab" data-tab="old-preview">Old version</div>
        <div class="tab" data-tab="new-preview">New version</div>
      </div>
      <div id="tab-comparison" class="tab-content active"></div>
      <div id="tab-old-preview" class="tab-content"></div>
      <div id="tab-new-preview" class="tab-content"></div>
    </div>
  </main>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js"></script>
  
  <script>
    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let oldFile = null, newFile = null;
    const zoneOld = document.getElementById('zone-old'), zoneNew = document.getElementById('zone-new');
    const fileOld = document.getElementById('file-old'), fileNew = document.getElementById('file-new');
    const btnCompare = document.getElementById('btn-compare'), btnNew = document.getElementById('btn-new');
    const uploadSection = document.getElementById('upload-section'), resultsSection = document.getElementById('results-section');

    function setupDropZone(zone, input, onFile) {
      zone.addEventListener('click', () => input.click());
      input.addEventListener('change', e => { if (e.target.files[0]) { onFile(e.target.files[0]); zone.querySelector('p').textContent = e.target.files[0].name; zone.style.borderColor = 'var(--primary)'; } });
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('active'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('active'));
      zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('active'); if (e.dataTransfer.files[0]) { onFile(e.dataTransfer.files[0]); zone.querySelector('p').textContent = e.dataTransfer.files[0].name; zone.style.borderColor = 'var(--primary)'; } });
    }

    setupDropZone(zoneOld, fileOld, f => oldFile = f);
    setupDropZone(zoneNew, fileNew, f => newFile = f);

    btnNew.addEventListener('click', () => {
      oldFile = null; newFile = null; fileOld.value = ''; fileNew.value = '';
      zoneOld.querySelector('p').textContent = 'Drop your original document here or click to browse';
      zoneNew.querySelector('p').textContent = 'Drop the updated document here or click to browse';
      zoneOld.style.borderColor = ''; zoneNew.style.borderColor = '';
      uploadSection.classList.remove('hidden'); resultsSection.classList.add('hidden');
    });

    btnCompare.addEventListener('click', async () => {
      if (!oldFile || !newFile) return alert('Please select both old and new documents.');
      btnCompare.disabled = true; btnCompare.textContent = 'Processing...';
      try {
        await runComparison();
        uploadSection.classList.add('hidden'); resultsSection.classList.remove('hidden');
      } catch (err) { alert('Error: ' + err.message); } 
      finally { btnCompare.disabled = false; btnCompare.textContent = 'Compare'; }
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active'); document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      });
    });

    async function parseFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'pdf') return { type: 'pdf', data: await file.arrayBuffer(), blobUrl: URL.createObjectURL(file) };
      if (ext === 'docx') { const res = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() }); return { type: 'text', content: res.value }; }
      if (ext === 'xlsx' || ext === 'csv') {
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        let csv = ""; wb.SheetNames.forEach(n => csv += XLSX.utils.sheet_to_csv(wb.Sheets[n]) + "\n");
        return { type: 'text', content: csv };
      }
      return { type: 'text', content: await file.text() };
    }

    // EXACT VISUAL PDF DIFF: Renders to canvas and compares pixel data
    async function comparePdfs(oldData, newData) {
      const oldPdf = await pdfjsLib.getDocument({ data: oldData }).promise;
      const newPdf = await pdfjsLib.getDocument({ data: newData }).promise;
      const maxPages = Math.max(oldPdf.numPages, newPdf.numPages);
      let diffCanvases = [];
      
      for (let i = 1; i <= maxPages; i++) {
        const oldC = document.createElement('canvas'), newC = document.createElement('canvas'), diffC = document.createElement('canvas');
        let w = 0, h = 0;
        
        if (i <= oldPdf.numPages) {
          const p = await oldPdf.getPage(i), v = p.getViewport({ scale: 1.5 });
          oldC.width = v.width; oldC.height = v.height;
          await p.render({ canvasContext: oldC.getContext('2d'), viewport: v }).promise;
          w = Math.max(w, v.width); h = Math.max(h, v.height);
        }
        if (i <= newPdf.numPages) {
          const p = await newPdf.getPage(i), v = p.getViewport({ scale: 1.5 });
          newC.width = v.width; newC.height = v.height;
          await p.render({ canvasContext: newC.getContext('2d'), viewport: v }).promise;
          w = Math.max(w, v.width); h = Math.max(h, v.height);
        }
        
        diffC.width = w; diffC.height = h;
        const ctx = diffC.getContext('2d');
        ctx.globalAlpha = 0.3; ctx.drawImage(newC, 0, 0); ctx.globalAlpha = 1.0; // Dim background
        
        const oldCtx = oldC.getContext('2d'), newCtx = newC.getContext('2d');
        const oldImg = oldC.width > 0 ? oldCtx.getImageData(0, 0, oldC.width, oldC.height) : null;
        const newImg = newC.width > 0 ? newCtx.getImageData(0, 0, newC.width, newC.height) : null;
        const diffImg = ctx.getImageData(0, 0, w, h);
        
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const inOld = oldImg && x < oldC.width && y < oldC.height;
            const inNew = newImg && x < newC.width && y < newC.height;
            let isDiff = !inOld || !inNew;
            
            if (!isDiff) {
              const oIdx = (y * oldC.width + x) * 4, nIdx = (y * newC.width + x) * 4;
              if (Math.abs(oldImg.data[oIdx] - newImg.data[nIdx]) > 30 || 
                  Math.abs(oldImg.data[oIdx+1] - newImg.data[nIdx+1]) > 30 || 
                  Math.abs(oldImg.data[oIdx+2] - newImg.data[nIdx+2]) > 30) isDiff = true;
            }
            if (isDiff) { diffImg.data[idx] = 255; diffImg.data[idx+1] = 0; diffImg.data[idx+2] = 255; diffImg.data[idx+3] = 200; } // Magenta highlight
          }
        }
        ctx.putImageData(diffImg, 0, 0);
        diffCanvases.push(diffC);
      }
      return diffCanvases;
    }

    async function runComparison() {
      const oldP = await parseFile(oldFile), newP = await parseFile(newFile);
      const compView = document.getElementById('tab-comparison'); compView.innerHTML = '';
      
      if (oldP.type === 'pdf' && newP.type === 'pdf') {
        const canvases = await comparePdfs(oldP.data, newP.data);
        canvases.forEach(c => { c.style.maxWidth = '100%'; c.style.border = '1px solid var(--border)'; c.style.marginBottom = '10px'; c.style.background = '#fff'; compView.appendChild(c); });
      } else {
        const diff = Diff.diffLines(oldP.content, newP.content);
        let html = '<div class="diff-line">';
        diff.forEach(p => { html += `<span class="${p.added ? 'added' : p.removed ? 'removed' : ''}">${escapeHtml(p.value)}</span>`; });
        compView.innerHTML = html + '</div>';
      }
      updatePreview('tab-old-preview', oldP); updatePreview('tab-new-preview', newP);
    }

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    function updatePreview(id, parsed) {
      const c = document.getElementById(id); c.innerHTML = '';
      if (parsed.type === 'pdf') {
        const iframe = document.createElement('iframe'); iframe.src = parsed.blobUrl; iframe.className = 'preview-frame'; c.appendChild(iframe);
      } else {
        const pre = document.createElement('pre'); pre.className = 'preview-text'; pre.textContent = parsed.content; c.appendChild(pre);
      }
    }
  </script>
</body>
</html>
